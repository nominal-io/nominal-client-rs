[package]
name = "nominal-extractor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Experimental local runtime for Nominal containerized extractors"
license = "Apache-2.0"
[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
